services:
  postgres:
    image: postgres:16-alpine
    container_name: osc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: osc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osc_password}
      POSTGRES_DB: osc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osc_user -d osc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osc_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: osc_migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      XLSX_PATH: /app/data/OSCs-update-status.xlsx
    volumes:
      - ./data:/app/data:ro
    profiles:
      - migrate

volumes:
  postgres_data:
